<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/streamlit.min.js"></script>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    background: #151515;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
}

#display {
    font-size: clamp(52px, 13vw, 86px);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

#status {
    color: #ffb3b3;
    margin-bottom: 10px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 20px;
    font-weight: bold;
    width: 48%;
    color: white;
}

#start {
    background: #16803c;
}

#stop {
    background: #b32020;
}

#submit {
    width: 95%;
    background: #1768bd;
}

button:disabled {
    opacity: 0.4;
}

input {
    width: 90%;
    padding: 12px;
    font-size: 17px;
    border-radius: 10px;
    margin: 10px 0;
    background: #222;
    border: 1px solid #555;
    color: white;
}

#submitBox {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div id="status">READY</div>

    <div id="display">00.000</div>

    <p>SECONDS</p>

    <button id="start">START</button>

    <button id="stop" disabled>STOP</button>

    <div id="result"></div>

    <div id="submitBox">

        <p>Timer stopped! Enter Instagram ID:</p>

        <input
            id="instagram"
            placeholder="Instagram username"
            maxlength="30"
        >

        <button id="submit">SUBMIT ENTRY</button>

    </div>

    <div id="usedMessage"
    style="display:none;color:#ff7777">
        You have already played today.
        Come back tomorrow.
    </div>

</div>

<script>
const target = Number(Streamlit.args.target);
const day = String(Streamlit.args.day);

const storageKey = "giveaway_played_" + day;

let startTime = null;
let stopped = false;
let elapsed = 0;
let animation = null;
let beeped = false;

const display = document.getElementById("display");
const status = document.getElementById("status");

const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

const result = document.getElementById("result");
const submitBox = document.getElementById("submitBox");


function beep() {

    try {

        const audio = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        const oscillator = audio.createOscillator();
        const gain = audio.createGain();

        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;

        oscillator.connect(gain);
        gain.connect(audio.destination);

        oscillator.start();

        setTimeout(() => {
            oscillator.stop();
            audio.close();
        }, 250);

    } catch (e) {}
}


function timerLoop() {

    if (startTime === null || stopped) {
        return;
    }

    const seconds =
        (performance.now() - startTime) / 1000;

    display.textContent = seconds.toFixed(3);

    if (!beeped && seconds >= target) {

        beeped = true;

        beep();

        status.textContent = "🎯 TARGET! STOP NOW";

        status.style.color = "#ffe066";
    }

    animation = requestAnimationFrame(timerLoop);
}


if (localStorage.getItem(storageKey)) {

    startBtn.disabled = true;
    stopBtn.disabled = true;

    document.getElementById(
        "usedMessage"
    ).style.display = "block";

    status.textContent = "ALREADY PLAYED";

} else {

    startBtn.onclick = function() {

        if (startTime !== null) {
            return;
        }

        startTime = performance.now();

        status.textContent = "RUNNING";

        startBtn.disabled = true;

        stopBtn.disabled = false;

        animation = requestAnimationFrame(timerLoop);
    };


    stopBtn.onclick = function() {

        if (startTime === null || stopped) {
            return;
        }

        stopped = true;

        cancelAnimationFrame(animation);

        elapsed =
            (performance.now() - startTime) / 1000;

        display.textContent = elapsed.toFixed(3);

        status.textContent = "STOPPED";

        stopBtn.disabled = true;

        result.textContent =
            "Stopped time: " + elapsed.toFixed(3) + " sec";

        submitBox.style.display = "block";

        Streamlit.setFrameHeight(
            document.body.scrollHeight
        );
    };


    document.getElementById("submit").onclick = function() {

        const instagram = document.getElementById(
            "instagram"
        ).value.trim().replace(/^@/, "").toLowerCase();

        if (instagram.length < 2) {

            result.textContent =
                "Please enter a valid Instagram ID.";

            return;
        }

        localStorage.setItem(storageKey, "1");

        Streamlit.setComponentValue({
            submitted: true,
            elapsed: elapsed,
            instagram: instagram
        });

        document.getElementById("submit").disabled = true;

        result.textContent = "Submitting...";
    };

}


Streamlit.setComponentReady();

Streamlit.setFrameHeight(
    document.body.scrollHeight
);

</script>

</body>
</html>
