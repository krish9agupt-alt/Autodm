
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/streamlit.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    background: transparent;
    color: white;
    font-family: Arial, sans-serif;
}

.panel {
    background: linear-gradient(145deg, #181818, #090909);
    border: 1px solid #444;
    border-radius: 18px;
    padding: 20px 14px;
    text-align: center;
}

.timer {
    font-size: clamp(48px, 12vw, 76px);
    font-weight: 900;
    color: #ffe18a;
    font-variant-numeric: tabular-nums;
    margin: 15px 0;
}

.status {
    color: #ccc;
    min-height: 24px;
    margin-bottom: 15px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin: 6px 0;
}

.start {
    background: #20c767;
    color: #061b0d;
}

.stop {
    background: #ff3838;
    color: white;
}

.submit {
    background: #ffcf4a;
    color: #111;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid #666;
    background: #111;
    color: white;
    margin: 8px 0;
}

.hidden {
    display: none !important;
}

.note {
    font-size: 12px;
    color: #aaa;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="panel">

    <div style="font-size:14px;color:#ccc">
        STOP AS CLOSE AS POSSIBLE
    </div>

    <div id="timer" class="timer">0.000</div>

    <div id="status" class="status">
        Ready? Press START
    </div>

    <button id="startBtn" class="start">
        ▶ START TIMER
    </button>

    <button id="stopBtn" class="stop hidden">
        ■ STOP TIMER
    </button>

    <div id="usernameBox" class="hidden">

        <div style="font-size:18px;margin:12px 0">
            Submit your Instagram ID
        </div>

        <input
            id="instagram"
            type="text"
            placeholder="@your_instagram_id"
            maxlength="30"
            autocomplete="off"
        >

        <button id="submitBtn" class="submit">
            🎁 SUBMIT ENTRY
        </button>

    </div>

    <div id="playedMsg" class="hidden">
        <p style="color:#ff7777;font-weight:bold">
            You have already used the timer today on this browser/device.
        </p>
    </div>

    <div class="note">
        One attempt per day per browser/device.
    </div>

</div>

<script>
const timerEl = document.getElementById("timer");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const usernameBox = document.getElementById("usernameBox");
const instagramInput = document.getElementById("instagram");
const submitBtn = document.getElementById("submitBtn");
const playedMsg = document.getElementById("playedMsg");

let target = 15;
let day = "";
let running = false;
let stopped = false;
let startTime = 0;
let elapsed = 0;
let rafId = null;
let beeped = false;
let attemptToken = "";

function lockKey() {
    return "giveaway_played_" + day;
}

function formatTime(value) {
    return value.toFixed(3);
}

function updateTimer() {
    if (!running) return;

    elapsed = (performance.now() - startTime) / 1000;
    timerEl.textContent = formatTime(elapsed);

    if (!beeped && elapsed >= target) {
        beeped = true;
        statusEl.textContent = "🎯 TARGET! STOP NOW!";
        playBeep();
    }

    rafId = requestAnimationFrame(updateTimer);
}

function playBeep() {
    try {
        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = "sine";
        oscillator.frequency.value = 1000;
        gain.gain.value = 0.2;

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();

        setTimeout(() => {
            oscillator.stop();
            ctx.close();
        }, 500);

    } catch (e) {
        console.log("Audio unavailable", e);
    }
}

function refreshHeight() {
    Streamlit.setFrameHeight(
        document.documentElement.scrollHeight + 20
    );
}

function startTimer() {
    if (running || stopped) return;

    // Reserve the daily attempt when the user starts.
    try {
        if (localStorage.getItem(lockKey())) {
            startBtn.classList.add("hidden");
            playedMsg.classList.remove("hidden");
            statusEl.textContent = "Already used today.";
            refreshHeight();
            return;
        }

        localStorage.setItem(lockKey(), "1");

    } catch (e) {
        console.log("LocalStorage unavailable");
    }

    running = true;
    startTime = performance.now();
    elapsed = 0;
    beeped = false;

    startBtn.classList.add("hidden");
    stopBtn.classList.remove("hidden");

    statusEl.textContent = "Timer running...";
    rafId = requestAnimationFrame(updateTimer);

    refreshHeight();
}

function stopTimer() {
    if (!running) return;

    running = false;
    stopped = true;

    if (rafId) {
        cancelAnimationFrame(rafId);
    }

    elapsed = (performance.now() - startTime) / 1000;
    timerEl.textContent = formatTime(elapsed);

    stopBtn.classList.add("hidden");
    usernameBox.classList.remove("hidden");

    statusEl.textContent = "Stopped! Enter your Instagram ID.";

    refreshHeight();
}

function submitEntry() {
    if (!stopped) return;

    let username = instagramInput.value
        .trim()
        .replace(/^@+/, "")
        .toLowerCase();

    if (!/^[a-z0-9._]{2,30}$/.test(username)) {
        statusEl.textContent = "Please enter a valid Instagram username.";
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    Streamlit.setComponentValue({
        submitted: true,
        instagram: username,
        elapsed: Number(elapsed.toFixed(3)),
        token: attemptToken
    });

    statusEl.textContent = "Entry submitted!";
}

startBtn.addEventListener("click", startTimer);
stopBtn.addEventListener("click", stopTimer);
submitBtn.addEventListener("click", submitEntry);

function onRender(event) {
    const args = event.detail.args || {};

    target = Number(args.target || 15);
    day = String(args.day || "");

    attemptToken = day + "_" +
        Date.now().toString() + "_" +
        Math.random().toString(36).slice(2);

    timerEl.textContent = "0.000";

    try {
        if (localStorage.getItem(lockKey())) {
            startBtn.classList.add("hidden");
            playedMsg.classList.remove("hidden");
            statusEl.textContent = "Already used today.";
        }
    } catch (e) {
        console.log("LocalStorage unavailable");
    }

    refreshHeight();
}

Streamlit.events.addEventListener(
    Streamlit.RENDER_EVENT,
    onRender
);

Streamlit.setComponentReady();
Streamlit.setFrameHeight(450);
</script>

</body>
</html>
