<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell narrow"><a class="back" href="/">← होम</a><section class="card"><p class="eyebrow">CONTROL PANEL</p><h2>Admin Login</h2>{% with messages = get_flashed_messages() %}{% for m in messages %}<p class="notice">{{ m }}</p>{% endfor %}{% endwith %}<form method="post"><label for="password">Admin password</label><input id="password" type="password" name="password" required><button class="btn primary full" type="submit">Login</button></form><p class="small muted">पहली बार डिप्लॉय करने से पहले ADMIN_PASSWORD बदलें।</p></section></main></body></html>
