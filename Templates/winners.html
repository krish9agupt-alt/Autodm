<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winner List</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell narrow"><a class="back" href="/">← वापस गेम पर</a><section class="card"><p class="eyebrow">HALL OF FAME</p><h2>विजेता सूची</h2>{% if winners %}<div class="table-wrap"><table><thead><tr><th>तारीख</th><th>विजेता</th><th>इनाम</th></tr></thead><tbody>{% for w in winners %}<tr><td>{{ w.day }}</td><td>{{ w.name }}</td><td>₹{{ w.prize }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<p class="muted">अभी कोई विजेता दर्ज नहीं है।</p>{% endif %}</section></main></body></html>
